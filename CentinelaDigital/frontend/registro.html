<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Centinela Digital</title>
    <style>
        body { background-color: #ffffff; color: #8B0000; font-family: Arial, sans-serif; text-align: center; margin-top: 80px; }
        .caja { border: 2px solid #8B0000; display: inline-block; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(139, 0, 0, 0.2); }
        input { display: block; margin: 12px auto; padding: 10px; width: 240px; border: 1px solid #8B0000; border-radius: 4px; }
        button { background-color: #8B0000; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        a { color: #8B0000; text-decoration: none; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>CENTINELA DIGITAL</h2>
        <h3>Registro de Usuario</h3>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>
</body>
</html>
